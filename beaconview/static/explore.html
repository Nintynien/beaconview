<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore · BeaconView</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="BeaconView">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M13 6 L23 2.5 L23 9.5 Z" fill="var(--accent)" opacity=".35"/>
        <path d="M11 6 L1 2.5 L1 9.5 Z" fill="var(--accent)" opacity=".2"/>
        <rect x="9.5" y="3.5" width="5" height="5" rx="1" fill="var(--accent)"/>
        <path d="M9 9.5 H15 L16.5 21 H7.5 Z" fill="var(--ink)"/>
        <rect x="6" y="21" width="12" height="1.5" rx=".75" fill="var(--ink)"/>
      </svg>
      <span class="name">BeaconView</span>
    </a>
    <nav class="nav" aria-label="Pages">
      <a href="/">Overview</a>
      <a href="/explore" aria-current="page">Explore</a>
      <a href="/settings">Settings</a>
    </nav>
    <span class="spacer"></span>
    <a class="ingest" href="/settings" title="Status and settings"><span class="dot" id="ingestDot"></span><span class="txt" id="ingestText">…</span></a>
    <button class="btn icon" id="themeBtn" type="button"></button>
  </header>

  <main>
    <div class="filters" role="toolbar" aria-label="Time range and filters">
      <div class="pop">
        <button class="btn" id="rangeBtn" type="button" aria-haspopup="true" aria-expanded="false"></button>
        <div class="menu" id="rangeMenu" hidden></div>
      </div>
      <div class="pop">
        <button class="btn" id="addBtn" type="button" aria-haspopup="true" aria-expanded="false">+ Filter</button>
        <div class="menu" id="addMenu" hidden>
          <form class="addf" id="addForm">
            <div class="row">
              <select id="addField" aria-label="Field"></select>
              <select id="addOp" aria-label="Match">
                <option value="is">is</option>
                <option value="not">is not</option>
              </select>
            </div>
            <input type="text" id="addHeader" placeholder="Header name, e.g. X-Request-Id" aria-label="Header name" hidden>
            <input type="text" id="addValue" list="addValues" autocomplete="off" aria-label="Value">
            <datalist id="addValues"></datalist>
            <div class="hint" id="addHint"></div>
            <div class="row"><span></span><button class="btn primary" type="submit">Add filter</button></div>
          </form>
        </div>
      </div>
      <span class="chips" id="chips"></span>
      <span class="grow"></span>
      <button class="btn" id="liveBtn" type="button" aria-pressed="false"
        title="">
        <span class="dot" id="liveDot"></span>Pause
      </button>
    </div>

    <div class="banner" id="statusBanner" role="status" hidden></div>
    <div class="banner error" id="banner" hidden></div>

    <section class="card" id="vizCard" aria-label="Chart">
      <div class="head vizhead">
        <div class="seg" role="tablist" aria-label="View">
          <button type="button" role="tab" id="viewTs" aria-selected="true" aria-controls="tsPanel">Timeseries</button>
          <button type="button" role="tab" id="viewBd" aria-selected="false" aria-controls="bdPanel">Breakdown</button>
        </div>
        <span class="ctl ts-only"><label for="measureSel">Show</label><select id="measureSel"></select></span>
        <span class="ctl ts-only" id="splitCtl"><label for="splitSel">Split by</label><select id="splitSel"></select></span>
        <span class="ctl bd-only" hidden><label for="groupSel">Group by</label><select id="groupSel"></select></span>
        <span class="spacer"></span>
        <span class="sub" id="vizSub"></span>
        <button class="btn ts-only" id="tableBtn" type="button" aria-pressed="false">Table</button>
        <a class="btn" id="vizCsv" href="#" download title="Download what this panel shows, as CSV">CSV</a>
      </div>
      <div id="tsPanel" role="tabpanel" aria-labelledby="viewTs">
        <div class="legend" id="vizLegend" hidden></div>
        <div id="tsChart" aria-describedby="tsHelp"></div>
        <div class="chart-table" id="tsTable" hidden></div>
        <p class="sr-only" id="tsHelp">Arrow keys step through time buckets; Enter shows the requests in that bucket. Click a bar to jump the log there, drag across the chart to zoom.</p>
      </div>
      <div id="bdPanel" role="tabpanel" aria-labelledby="viewBd" hidden>
        <div class="map bdmap" id="bdMap" hidden></div>
        <div class="tablewrap"><table class="plain bd" id="bdTable"></table></div>
      </div>
    </section>

    <section class="card" id="logsCard" aria-labelledby="logsTitle">
      <div class="head">
        <h2 id="logsTitle">Requests</h2>
        <span class="sub" id="logsSub"></span>
        <button class="btn" id="newestBtn" type="button" hidden>Back to newest</button>
        <button class="btn primary" id="unseenBtn" type="button" hidden></button>
        <span class="spacer"></span>
        <a class="btn" id="logsCsv" href="#" download title="Download every matching request (up to a million), as CSV">CSV</a>
      </div>
      <div class="more above"><button class="btn" id="newerBtn" type="button" hidden>Load newer</button></div>
      <div class="logwrap" id="logWrap">
        <table>
          <thead><tr id="logsHead"></tr></thead>
          <tbody class="rows" id="logsBody"></tbody>
        </table>
      </div>
      <div class="more"><button class="btn" id="moreBtn" type="button" hidden>Load older</button></div>
    </section>
  </main>
  <footer class="credit" id="credit" hidden></footer>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-labelledby="drawerTitle" role="dialog" aria-modal="true">
    <div class="head">
      <h2 id="drawerTitle">Request</h2>
      <span class="spacer"></span>
      <button class="btn icon" id="drawerClose" type="button" aria-label="Close">✕</button>
    </div>
    <dl id="drawerBody"></dl>
  </aside>

  <script src="/static/common.js"></script>
  <script src="/static/chart.js"></script>
  <script src="/static/map.js"></script>
  <script src="/static/explore.js"></script>
</body>
</html>
