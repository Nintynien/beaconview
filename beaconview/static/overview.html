<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overview · BeaconView</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="BeaconView">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M13 6 L23 2.5 L23 9.5 Z" fill="var(--accent)" opacity=".35"/>
        <path d="M11 6 L1 2.5 L1 9.5 Z" fill="var(--accent)" opacity=".2"/>
        <rect x="9.5" y="3.5" width="5" height="5" rx="1" fill="var(--accent)"/>
        <path d="M9 9.5 H15 L16.5 21 H7.5 Z" fill="var(--ink)"/>
        <rect x="6" y="21" width="12" height="1.5" rx=".75" fill="var(--ink)"/>
      </svg>
      <span class="name">BeaconView</span>
    </a>
    <nav class="nav" aria-label="Pages">
      <a href="/" aria-current="page">Overview</a>
      <a href="/explore" id="exploreNav">Explore</a>
      <a href="/settings">Settings</a>
    </nav>
    <span class="spacer"></span>
    <a class="ingest" href="/settings" title="Status and settings"><span class="dot" id="ingestDot"></span><span class="txt" id="ingestText">…</span></a>
    <button class="btn icon" id="themeBtn" type="button"></button>
  </header>

  <main>
    <div class="filters" role="toolbar" aria-label="Time range">
      <div class="pop">
        <button class="btn" id="rangeBtn" type="button" aria-haspopup="true" aria-expanded="false"></button>
        <div class="menu" id="rangeMenu" hidden></div>
      </div>
      <select id="instanceSel" aria-label="Instance" hidden></select>
      <span class="grow"></span>
      <button class="btn" id="liveBtn" type="button" aria-pressed="true">
        <span class="dot" id="liveDot"></span>Pause
      </button>
    </div>

    <div class="banner" id="statusBanner" role="status" hidden></div>
    <div class="banner error" id="banner" hidden></div>
    <section class="tiles" id="tiles" aria-label="Summary"></section>

    <div class="grid">
      <section class="card wide" id="seriesCard" aria-labelledby="seriesTitle">
        <div class="head">
          <h2 id="seriesTitle">Requests by status</h2>
          <span class="sub" id="seriesSub"></span>
          <span class="spacer"></span>
          <button class="btn" id="seriesTableBtn" type="button" aria-pressed="false">Table</button>
        </div>
        <div class="legend" id="seriesLegend" hidden></div>
        <div id="seriesChart"></div>
        <div class="chart-table" id="seriesTable" hidden></div>
      </section>

      <section class="card wide" id="servicesCard" aria-labelledby="servicesTitle">
        <div class="head">
          <h2 id="servicesTitle">Traffic by</h2>
          <select id="byRouter" aria-label="Group by">
            <option value="router">router</option>
            <option value="service">service</option>
            <option value="host">host</option>
          </select>
          <span class="spacer"></span>
          <label class="sub" for="bySort">Sort</label>
          <select id="bySort">
            <option value="requests">busiest</option>
            <option value="errors">most 5xx</option>
            <option value="p95">slowest (p95)</option>
          </select>
        </div>
        <div class="tablewrap"><table class="plain" id="servicesTable"></table></div>
      </section>

      <section class="card" id="statusCard"><div class="head"><h2>Status codes</h2><span class="spacer"></span><a class="go" data-top="status">Explore →</a></div><table class="plain" id="statusTable"></table></section>
      <section class="card" id="pathsCard"><div class="head"><h2>Paths</h2><span class="spacer"></span><a class="go" data-top="path">Explore →</a></div><table class="plain" id="pathsTable"></table></section>
      <section class="card" id="ipsCard"><div class="head"><h2>Client IPs</h2><span class="spacer"></span><a class="go" data-top="ip">Explore →</a></div><table class="plain" id="ipsTable"></table></section>
      <section class="card" id="uasCard"><div class="head"><h2>User agents</h2><span class="spacer"></span><a class="go" data-top="user_agent">Explore →</a></div><table class="plain" id="uasTable"></table></section>
      <section class="card" id="hostsCard"><div class="head"><h2>Hosts</h2><span class="spacer"></span><a class="go" data-top="host">Explore →</a></div><table class="plain" id="hostsTable"></table></section>

      <section class="card wide" id="errorsCard" aria-labelledby="errorsTitle">
        <div class="head">
          <h2 id="errorsTitle">Recent server errors</h2>
          <span class="sub">5xx, newest first</span>
          <span class="spacer"></span>
          <a class="go" id="errorsLink">Explore →</a>
        </div>
        <div class="tablewrap"><table class="plain" id="errorsTable"></table></div>
      </section>
    </div>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/chart.js"></script>
  <script src="/static/overview.js"></script>
</body>
</html>
